# ===== 两机分布式性能测试配置 =====
# 本文件用于 pytest -m performance 性能测试
#
# Machine A (本机): 运行 Company + Coordinator + Ray Head
# Machine B (远程): 运行 Partner Worker
#
# 使用前请将 MACHINE_A_IP / MACHINE_B_IP 替换为实际局域网 IP 地址
# 如果只有一台机器做退化测试, 可以把两个 IP 都设为 127.0.0.1

machine_a:
  ip: "127.0.0.1"               # ← 单机退化测试
  ray_port: 20001                  # Ray head 端口
  object_manager_port: 20002       # 对象存储管理端口 (固定, 跨机传输必须可达)
  node_manager_port: 20003         # 节点管理端口 (固定)
  min_worker_port: 10060           # Worker gRPC 端口范围起始
  max_worker_port: 10160           # Worker gRPC 端口范围结束
  company_spu_port: 9394           # Company SPU 端口
  coordinator_spu_port: 9396       # Coordinator SPU 端口
  ray_resources:
    company: 100
    coordinator: 100

machine_b:
  ip: "127.0.0.1"               # ← 单机退化测试
  partner_spu_port: 9395           # Partner SPU 端口
  ray_resources:
    partner: 100

ray:
  num_cpus: 16                      # 每个节点的 CPU 数量 (超分配，SPU/HEU actors需要大量CPU slot)
  object_store_memory: 100000000   # 100MB object store (内存紧张)
