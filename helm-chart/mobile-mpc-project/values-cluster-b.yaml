# 集群 B (Partner 集群) 配置
# 只部署 Partner 节点和只读 Web UI，不部署 Company

global:
  imageRegistry: ""  # 留空使用本地镜像

# Company 节点配置
company:
  enabled: false  # 集群 B 不部署 Company

# Partner 节点配置
partner:
  enabled: true  # 启用 Partner 节点
  
  image:
    repository: "mobile-mpc-partner"
    tag: "v1.0.19"
    pullPolicy: "Never"  # 使用本地镜像
  
  replicas: 1
  
  resources:
    requests:
      cpu: "8"
      memory: "4Gi"
    limits:
      cpu: "12"
      memory: "8Gi"
  
  # 服务配置 - 使用 NodePort 暴露端口以支持跨集群通信
  service:
    type: NodePort
    ports:
      spu: 9395          # Partner SPU 端口
      rayClient: 10001   # Ray Client 端口
      rayDashboard: 8265 # Ray Dashboard 端口
    nodePorts:
      spu: 30395         # 固定 NodePort
      rayClient: 30001   # Ray Client NodePort
      rayDashboard: 30265 # Ray Dashboard NodePort
  
  # 跨集群配置
  crossCluster:
    enabled: true  # 启用跨集群通信
    # Partner 节点的外部访问地址（供 Company Ray Head 连接）
    # 格式: <NodeIP>:<NodePort>
    externalAddress: "192.168.58.2:30001"  # 需要替换为实际的集群 B 节点 IP
  
  env:
    - name: NODE_ROLE
      value: "partner"
    - name: PARTNER_SPU_ADDR
      value: "0.0.0.0:9395"
    # hostNetwork 模式：直接使用节点 IP 和服务端口（无需 NodePort）
    - name: COMPANY_SPU_ADDR
      value: "192.168.49.2:9394"  # 集群 A 节点 IP + 直接端口
    - name: COORDINATOR_SPU_ADDR
      value: "192.168.49.2:9396"
    - name: RAY_HEAD_ADDR
      value: "192.168.49.2:6379"  # 使用直接端口，不再需要 NodePort

# Web UI 配置（只读模式）
webui:
  enabled: true  # 启用 Web UI（只读）
  
  image:
    repository: "mobile-mpc-partner"  # 使用 partner 镜像（包含只读 Web UI）
    tag: "v1.0.19"
    pullPolicy: "Never"
  
  replicas: 1
  
  resources:
    requests:
      cpu: "0.2"
      memory: "512Mi"
    limits:
      cpu: "0.5"
      memory: "1Gi"
  
  # 服务配置
  service:
    type: NodePort
    port: 8080
    targetPort: 8080
    nodePort: 30081  # 固定 NodePort，与集群 A 不同
  
  env:
    - name: NODE_ROLE
      value: "partner"
    # Company WebUI 的访问地址，用于 Partner 只读节点代理训练状态
    # 格式：http://<集群A节点IP>:<WebUI NodePort>
    - name: COMPANY_WEBUI_URL
      value: "http://192.168.49.2:30080"

# 持久化存储配置
persistence:
  enabled: true
  path: "/data/mobile-mpc"  # 宿主机路径
  storageClass: ""  # 使用 hostPath

