<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联邦学习Web UI - 跨机器通信</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .status-card {
            transition: all 0.3s ease;
        }

        .status-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .status-running {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
        }

        .status-stopped {
            background: linear-gradient(135deg, #dc3545, #fd7e14);
            color: white;
        }

        .status-starting {
            background: linear-gradient(135deg, #ffc107, #fd7e14);
            color: black;
        }

        .log-container {
            height: 300px;
            overflow-y: auto;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
        }

        .log-entry {
            padding: 0.25rem 0.5rem;
            border-bottom: 1px solid #e9ecef;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
        }

        .log-info {
            color: #0d6efd;
        }

        .log-error {
            color: #dc3545;
        }

        .log-warning {
            color: #fd7e14;
        }

        .progress-container {
            background: #e9ecef;
            border-radius: 0.375rem;
            overflow: hidden;
        }

        .system-metrics {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .config-panel {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
        }
    </style>
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-network-wired me-2"></i>
                联邦学习Web UI - 跨机器通信
            </span>
            <div class="d-flex">
                <span class="badge bg-success me-2" id="connection-status">
                    <i class="fas fa-circle me-1"></i>已连接
                </span>
                <span class="text-light" id="current-time"></span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- 系统概览 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card system-metrics">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="fas fa-tachometer-alt me-2"></i>系统概览
                        </h5>
                        <div class="row">
                            <div class="col-md-3">
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-microchip fa-2x me-3"></i>
                                    <div>
                                        <div class="h6 mb-0">CPU使用率</div>
                                        <div class="h4 mb-0" id="cpu-usage">0%</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-memory fa-2x me-3"></i>
                                    <div>
                                        <div class="h6 mb-0">内存使用率</div>
                                        <div class="h4 mb-0" id="memory-usage">0%</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-hdd fa-2x me-3"></i>
                                    <div>
                                        <div class="h6 mb-0">磁盘使用率</div>
                                        <div class="h4 mb-0" id="disk-usage">0%</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-clock fa-2x me-3"></i>
                                    <div>
                                        <div class="h6 mb-0">运行时间</div>
                                        <div class="h6 mb-0" id="uptime">00:00:00</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Company节点控制 -->
            <div class="col-lg-6 mb-4">
                <div class="card status-card" id="company-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-building me-2"></i>Company节点
                        </h5>
                        <span class="badge" id="company-status-badge">未启动</span>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">节点状态</label>
                            <div class="d-flex align-items-center">
                                <div class="flex-grow-1 me-3">
                                    <div class="progress">
                                        <div class="progress-bar" id="company-progress" role="progressbar"
                                            style="width: 0%"></div>
                                    </div>
                                </div>
                                <span class="badge bg-secondary" id="company-status">未启动</span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">IP地址</label>
                            <input type="text" class="form-control" id="company-ip" value="210.28.133.104">
                        </div>

                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label">Ray端口</label>
                                <input type="number" class="form-control" id="company-ray-port" value="20001">
                            </div>
                            <div class="col-6">
                                <label class="form-label">SPU端口</label>
                                <input type="number" class="form-control" id="company-spu-port" value="11001">
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button class="btn btn-success" id="start-company-btn">
                                <i class="fas fa-play me-2"></i>启动Company
                            </button>
                            <button class="btn btn-danger" id="stop-company-btn" disabled>
                                <i class="fas fa-stop me-2"></i>停止Company
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Partner节点控制 -->
            <div class="col-lg-6 mb-4">
                <div class="card status-card" id="partner-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-handshake me-2"></i>Partner节点
                        </h5>
                        <span class="badge" id="partner-status-badge">未启动</span>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">节点状态</label>
                            <div class="d-flex align-items-center">
                                <div class="flex-grow-1 me-3">
                                    <div class="progress">
                                        <div class="progress-bar" id="partner-progress" role="progressbar"
                                            style="width: 0%"></div>
                                    </div>
                                </div>
                                <span class="badge bg-secondary" id="partner-status">未启动</span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">IP地址</label>
                            <input type="text" class="form-control" id="partner-ip" value="210.28.133.104">
                        </div>

                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label">SPU端口</label>
                                <input type="number" class="form-control" id="partner-spu-port" value="11002">
                            </div>
                            <div class="col-6">
                                <label class="form-label">连接端口</label>
                                <input type="number" class="form-control" id="partner-connect-port" value="54001">
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button class="btn btn-success" id="start-partner-btn">
                                <i class="fas fa-play me-2"></i>启动Partner
                            </button>
                            <button class="btn btn-danger" id="stop-partner-btn" disabled>
                                <i class="fas fa-stop me-2"></i>停止Partner
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 训练控制 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-brain me-2"></i>联邦学习训练控制
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">训练状态</label>
                                    <div class="d-flex align-items-center">
                                        <span class="badge bg-secondary me-3" id="training-status">未开始</span>
                                        <div class="flex-grow-1">
                                            <div class="progress">
                                                <div class="progress-bar" id="training-progress" role="progressbar"
                                                    style="width: 0%"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-6">
                                        <label class="form-label">当前步数</label>
                                        <input type="text" class="form-control" id="current-step" readonly>
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label">总步数</label>
                                        <input type="text" class="form-control" id="total-steps" readonly>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-6">
                                        <label class="form-label">准确率</label>
                                        <input type="text" class="form-control" id="accuracy" readonly>
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label">损失值</label>
                                        <input type="text" class="form-control" id="loss" readonly>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="d-grid gap-2">
                                    <button class="btn btn-primary" id="start-training-btn" disabled>
                                        <i class="fas fa-play me-2"></i>开始训练
                                    </button>
                                    <button class="btn btn-warning" id="pause-training-btn" disabled>
                                        <i class="fas fa-pause me-2"></i>暂停训练
                                    </button>
                                    <button class="btn btn-danger" id="stop-training-btn" disabled>
                                        <i class="fas fa-stop me-2"></i>停止训练
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 日志和配置 -->
        <div class="row">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-terminal me-2"></i>系统日志
                        </h5>
                        <button class="btn btn-sm btn-outline-secondary" id="clear-logs-btn">
                            <i class="fas fa-trash me-1"></i>清空日志
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="log-container" id="log-container">
                            <div class="log-entry log-info">
                                <span class="text-muted">[2024-01-01 12:00:00]</span>
                                <span class="ms-2">系统启动完成</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-cog me-2"></i>配置管理
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Coordinator IP</label>
                            <input type="text" class="form-control" id="coordinator-ip" value="210.28.133.104">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Coordinator SPU端口</label>
                            <input type="number" class="form-control" id="coordinator-spu-port" value="11003">
                        </div>

                        <div class="d-grid gap-2">
                            <button class="btn btn-primary" id="save-config-btn">
                                <i class="fas fa-save me-2"></i>保存配置
                            </button>
                            <button class="btn btn-outline-secondary" id="load-config-btn">
                                <i class="fas fa-upload me-2"></i>加载配置
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        // WebSocket连接
        const socket = io();

        // 状态管理
        let systemState = {
            company_status: '未启动',
            partner_status: '未启动',
            training_status: '未开始',
            current_step: 0,
            total_steps: 0,
            accuracy: 0.0,
            loss: 0.0
        };

        // 连接状态
        socket.on('connect', function () {
            updateConnectionStatus(true);
            console.log('已连接到服务器');
        });

        socket.on('disconnect', function () {
            updateConnectionStatus(false);
            console.log('与服务器断开连接');
        });

        // 状态更新
        socket.on('status_update', function (data) {
            updateSystemState(data);
        });

        // 日志更新
        socket.on('log_update', function (logEntry) {
            addLogEntry(logEntry);
        });

        // 更新连接状态
        function updateConnectionStatus(connected) {
            const statusElement = document.getElementById('connection-status');
            if (connected) {
                statusElement.className = 'badge bg-success me-2';
                statusElement.innerHTML = '<i class="fas fa-circle me-1"></i>已连接';
            } else {
                statusElement.className = 'badge bg-danger me-2';
                statusElement.innerHTML = '<i class="fas fa-circle me-1"></i>已断开';
            }
        }

        // 更新系统状态
        function updateSystemState(data) {
            Object.assign(systemState, data);

            // 更新Company状态
            updateNodeStatus('company', data.company_status);

            // 更新Partner状态
            updateNodeStatus('partner', data.partner_status);

            // 更新训练状态
            if (data.training_status) {
                document.getElementById('training-status').textContent = data.training_status;
                document.getElementById('training-status').className = getStatusBadgeClass(data.training_status);
            }

            if (data.current_step !== undefined) {
                document.getElementById('current-step').value = data.current_step;
            }

            if (data.total_steps !== undefined) {
                document.getElementById('total-steps').value = data.total_steps;
                const progress = data.total_steps > 0 ? (data.current_step / data.total_steps) * 100 : 0;
                document.getElementById('training-progress').style.width = progress + '%';
            }

            if (data.accuracy !== undefined) {
                document.getElementById('accuracy').value = data.accuracy.toFixed(4);
            }

            if (data.loss !== undefined) {
                document.getElementById('loss').value = data.loss.toFixed(6);
            }

            // 更新按钮状态
            updateButtonStates();
        }

        // 更新节点状态
        function updateNodeStatus(nodeType, status) {
            const statusElement = document.getElementById(nodeType + '-status');
            const badgeElement = document.getElementById(nodeType + '-status-badge');
            const cardElement = document.getElementById(nodeType + '-card');

            statusElement.textContent = status;
            badgeElement.textContent = status;
            badgeElement.className = 'badge ' + getStatusBadgeClass(status);

            // 更新卡片样式
            cardElement.className = 'card status-card ' + getStatusCardClass(status);
        }

        // 获取状态徽章样式
        function getStatusBadgeClass(status) {
            switch (status) {
                case '运行中': return 'bg-success';
                case '启动中': return 'bg-warning';
                case '已停止': return 'bg-danger';
                default: return 'bg-secondary';
            }
        }

        // 获取状态卡片样式
        function getStatusCardClass(status) {
            switch (status) {
                case '运行中': return 'status-running';
                case '启动中': return 'status-starting';
                case '已停止': return 'status-stopped';
                default: return '';
            }
        }

        // 更新按钮状态
        function updateButtonStates() {
            const companyRunning = systemState.company_status === '运行中';
            const partnerRunning = systemState.partner_status === '运行中';
            const bothRunning = companyRunning && partnerRunning;

            // Company按钮
            document.getElementById('start-company-btn').disabled = companyRunning;
            document.getElementById('stop-company-btn').disabled = !companyRunning;

            // Partner按钮
            document.getElementById('start-partner-btn').disabled = partnerRunning;
            document.getElementById('stop-partner-btn').disabled = !partnerRunning;

            // 训练按钮
            document.getElementById('start-training-btn').disabled = !bothRunning;
        }

        // 添加日志条目
        function addLogEntry(logEntry) {
            const logContainer = document.getElementById('log-container');
            const logElement = document.createElement('div');
            logElement.className = 'log-entry log-' + logEntry.level.toLowerCase();

            logElement.innerHTML = `
                <span class="text-muted">[${logEntry.timestamp}]</span>
                <span class="ms-2">${logEntry.message}</span>
            `;

            logContainer.appendChild(logElement);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // 事件监听器
        document.getElementById('start-company-btn').addEventListener('click', function () {
            fetch('/api/start_company', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        addLogEntry({
                            timestamp: new Date().toLocaleString(),
                            level: 'INFO',
                            message: 'Company节点启动命令已发送'
                        });
                    }
                });
        });

        document.getElementById('stop-company-btn').addEventListener('click', function () {
            fetch('/api/stop_company', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        addLogEntry({
                            timestamp: new Date().toLocaleString(),
                            level: 'INFO',
                            message: 'Company节点停止命令已发送'
                        });
                    }
                });
        });

        document.getElementById('start-partner-btn').addEventListener('click', function () {
            fetch('/api/start_partner', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        addLogEntry({
                            timestamp: new Date().toLocaleString(),
                            level: 'INFO',
                            message: 'Partner节点启动命令已发送'
                        });
                    }
                });
        });

        document.getElementById('stop-partner-btn').addEventListener('click', function () {
            fetch('/api/stop_partner', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        addLogEntry({
                            timestamp: new Date().toLocaleString(),
                            level: 'INFO',
                            message: 'Partner节点停止命令已发送'
                        });
                    }
                });
        });

        document.getElementById('start-training-btn').addEventListener('click', function () {
            fetch('/api/start_training', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        addLogEntry({
                            timestamp: new Date().toLocaleString(),
                            level: 'INFO',
                            message: '训练启动命令已发送'
                        });
                    }
                });
        });

        document.getElementById('clear-logs-btn').addEventListener('click', function () {
            document.getElementById('log-container').innerHTML = '';
        });

        // 定期更新系统信息
        setInterval(function () {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    if (data.system_info) {
                        document.getElementById('cpu-usage').textContent = data.system_info.cpu_percent.toFixed(1) + '%';
                        document.getElementById('memory-usage').textContent = data.system_info.memory_percent.toFixed(1) + '%';
                        document.getElementById('disk-usage').textContent = data.system_info.disk_percent.toFixed(1) + '%';
                    }
                });
        }, 5000);

        // 更新时间
        function updateTime() {
            const now = new Date();
            document.getElementById('current-time').textContent = now.toLocaleString();
        }

        setInterval(updateTime, 1000);
        updateTime();

        // 初始化
        fetch('/api/status')
            .then(response => response.json())
            .then(data => {
                updateSystemState(data);
            });
    </script>
</body>

</html>
