[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Pure math/logic unit tests (no SecretFlow)
    integration: Integration tests requiring SecretFlow single_sim
    performance: Performance benchmarks requiring multi_distributed (two-machine)
    model_eval: Model accuracy evaluation tests
    slow: Tests that take a long time to run

addopts = -v --tb=short
